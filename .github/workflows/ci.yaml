name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  check:
    name: Golang Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  unit-test:
    name: Unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make ci-unit-test

  integration-test:
    name: Integration test
    runs-on: ubuntu-latest
    needs: [check, unit-test]
    strategy:
      matrix:
        kubernetes: [1.34.8, 1.35.5, 1.36.1]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install conntrack
        run: sudo apt-get install --yes conntrack
      - uses: medyagh/setup-minikube@v0.0.21
        with:
          kubernetes-version: ${{ matrix.kubernetes }}
          driver: none
      - name: Add redisfailover CRD
        run: kubectl create --filename manifests/databases.spotahome.com_redisfailovers.yaml
      - name: Run integration tests
        env:
          # client-go 0.36 ships WatchListClient enabled by default. On Kubernetes
          # API servers < 1.36 the initial events stream never delivers the
          # required BOOKMARK event, so informers hang forever on cache sync.
          # Disable the feature gate from the client side to keep the matrix
          # green across all supported server versions.
          KUBE_FEATURE_WatchListClient: "false"
        run: make ci-integration-test

  chart-test:
    name: Chart testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.21.0

      - name: Helm test
        run: make helm-test
